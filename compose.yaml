services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coffeetime
    ports:
      - '5432:5432'
    volumes:
      - coffee-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d coffeetime']
      interval: 5s
      retries: 5
volumes:
  coffee-data:
